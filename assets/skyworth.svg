<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="627" viewBox="0 0 196 30" role="img" aria-label="SKYWORTH 创维" preserveAspectRatio="xMinYMid meet">
<title>SKYWORTH 创维</title>
<!--
  The SKYWORTH corporate wordmark.

  DRAWN AS SVG TEXT, NOT TRACED OUTLINES, because no vector of the official
  mark was supplied - only a raster. Tracing a bitmap gives ragged curves that
  look worse the larger they are printed, which is the opposite of what a 4K
  asset is for. Text stays mathematically sharp at any size.

  `textLength` with `lengthAdjust="spacingAndGlyphs"` pins each run to an exact
  width, so the mark occupies the same box on a machine with Arial Black and on
  one without. That matters here: these pages are opened straight off disk and
  cannot fetch a font, so a wordmark whose width followed the viewer's font
  stack would shift the header on every machine.

  The width/height above are the 4K raster size for anything that exports this
  file; the viewBox is what actually governs, so it scales losslessly.

  Fill is explicit rather than currentColor because a standalone .svg loaded
  through <img> has no parent to inherit from. Where the colour has to change
  with its background - the dark page headers - the same markup is INLINED and
  uses currentColor instead. This file is the one home the mark has: if the
  official .ai or .svg artwork turns up, replace it here.
-->
<text x="0" y="23.5" textLength="140" lengthAdjust="spacingAndGlyphs"
      font-family="Arial Black, Arial Bold, Helvetica Neue, Segoe UI, system-ui, sans-serif"
      font-size="25" font-weight="900" letter-spacing="-0.4" fill="#001b48">SKYWORTH</text>
<text x="150" y="24" textLength="46" lengthAdjust="spacingAndGlyphs"
      font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans SC, Source Han Sans SC, SimHei, sans-serif"
      font-size="25" font-weight="700" fill="#001b48">创维</text>
</svg>
